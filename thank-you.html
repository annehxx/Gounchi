<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thank You – Cleo Fox</title>

  <link rel="stylesheet" href="style.css" />
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&display=swap"
    rel="stylesheet"
  />
  <link rel="icon" type="image/png" href="images/logo-white.png">
</head>

<body>

  <!-- ===== Header (minimal) ===== -->
  <header class="header">
    <nav class="nav container">
      <div class="nav-brand">
        <img src="images/logo-white.png" alt="Cleo Fox logo" class="logo-img">
        <span class="logo-text">Cleo Fox</span>
      </div>
    </nav>
  </header>

  <!-- ===== Thank You Hero ===== -->
  <section class="hero thank-you-hero">
    <div class="glass thank-you-glass">
      <div class="hero-content">
        <h1>Thank you.</h1>
        <p>
          Your booking request has been received.<br>
          I will review your message carefully and get back to you if we are a match.
        </p>

        <a href="index.html" class="btn">Return Home</a>
      </div>
    </div>
  </section>

  <!-- ===== Footer ===== -->
  <footer class="footer">
    <p>&copy; 2026 Cleo Fox. All rights reserved.</p>
  </footer>

</body>
</html>
